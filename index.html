<!-- Preemptive UX Helper: Auto comma formatting & Result sharing -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
      // Auto comma on number/text inputs with currency hints
      const moneyInputs = document.querySelectorAll('input[type="text"], input[type="number"], input[inputmode="numeric"]');
      moneyInputs.forEach(input => {
        // Skip specific inputs like year, month, date, percent, id
        const name = (input.name || input.id || '').toLowerCase();
        if (name.includes('year') || name.includes('month') || name.includes('day') || name.includes('rate') || name.includes('percent') || name.includes('age') || name.includes('score')) {
          return;
        }
        
        // Listen to input
        input.addEventListener('input', function(e) {
          if (this.type === 'number') return; // native number handles own UI
          let val = this.value.replace(/[^0-9]/g, '');
          if (val) {
            this.value = Number(val).toLocaleString('ko-KR');
          }
        });
      });

      // Inject Global Result Copy Function if not exists
      window.copyResultToClipboard = function(textToCopy, customBtn) {
        if (!textToCopy) {
          const resEl = document.querySelector('#result, .result-box, [id*="result"], [class*="result"]');
          textToCopy = resEl ? resEl.innerText.trim() : window.location.href;
        }
        navigator.clipboard.writeText(textToCopy + "\n\n👉 계산기 바로가기: " + window.location.href).then(() => {
          showToastNotification('계산 결과가 클립보드에 복사되었습니다!');
        }).catch(() => {
          showToastNotification('복사되었습니다: ' + window.location.href);
        });
      };

      function showToastNotification(msg) {
        let toast = document.getElementById('global-ux-toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'global-ux-toast';
          toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:9999px;font-size:14px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,0.2);z-index:9999;transition:all 0.3s ease;opacity:0;pointer-events:none;';
          document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateX(-50%) translateY(10px)';
        }, 2200);
      }
    });
  </script>
<!-- 하단 대형 배너 (푸터 직전) -->
<!-- Global UX Helper: Universal Result Copy & Toast -->
<script>
    window.showToastNotification = function(msg) {
      let toast = document.getElementById('global-ux-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'global-ux-toast';
        toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:9999px;font-size:14px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,0.2);z-index:9999;transition:all 0.3s ease;opacity:0;pointer-events:none;';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.opacity = '1';
      toast.style.transform = 'translateX(-50%) translateY(0)';
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(10px)';
      }, 2200);
    };

    window.copyResultToClipboard = function(customText) {
      let textToCopy = customText;
      if (!textToCopy) {
        const resEl = document.querySelector('#resultBox, .result-card, #result, [id*="result"], [class*="result"], [id*="res"]');
        textToCopy = resEl ? resEl.innerText.trim() : document.title;
      }
      const fullText = textToCopy + "\n\n👉 바로가기: " + window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(fullText).then(() => {
          window.showToastNotification('결과가 클립보드에 복사되었습니다! 🎉');
        }).catch(() => fallbackCopy(fullText));
      } else {
        fallbackCopy(fullText);
      }
    };

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        window.showToastNotification('결과가 클립보드에 복사되었습니다! 🎉');
      } catch (e) {
        window.showToastNotification('복사에 실패했습니다.');
      }
      document.body.removeChild(ta);
    }
  </script>
